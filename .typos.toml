[default.extend-words]
# Asterisc is a fault proof VM (RISC-V), not a typo of asterisk.
asterisc = "asterisc"

[files]
# Generated by release-please from commit messages.
extend-exclude = ["CHANGELOG.md"]

[default]
# Truncated addresses in the docs, e.g. 0x8b3a...ba.
extend-ignore-re = ["0x[0-9a-fA-F]{4}\\.\\.\\.[0-9a-fA-F]+"]
