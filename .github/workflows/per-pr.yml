name: CI

on:
  push:
    branches: [overlay/**]
  pull_request:

concurrency:
  group: "${{ github.workflow_ref }}-${{ github.head_ref }}"
  cancel-in-progress: true

jobs:
  run_with_args:
    name: Run kurtosis with arguments
    strategy:
      fail-fast: false
      matrix:
        file_name:
          - ./.github/tests/blockscout.yaml
          - ./.github/tests/custom.yaml
          - ./.github/tests/flashblocks.yaml
          - ./.github/tests/hildr.yaml
          - ./.github/tests/multiple_l2s.yaml
          - ./.github/tests/op-besu.yaml
          - ./.github/tests/op-erigon.yaml
          - ./.github/tests/op-geth.yaml
          - ./.github/tests/op-geth-reth-custom-batcher.yaml
          - ./.github/tests/op-nethermind.yaml
          - ./.github/tests/op-node.yaml
          - ./.github/tests/op-reth.yaml
          - ./.github/tests/rollup-boost.yaml
          - ./.github/tests/simple.yaml
          - ./.github/tests/single_l2.yaml
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout Repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup environment
        uses: ./.github/workflows/actions/setup-environment

      - name: Run kurtosis
        uses: ./.github/workflows/actions/run-kurtosis-docker
        with:
          args-file: ${{ matrix.file_name }}

  # Make sure that `kurtosis run .` without an --args-file works fine (the defaults in input_parser.star are correct)
  run_without_args:
    name: Run kurtosis without arguments
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup environment
        uses: ./.github/workflows/actions/setup-environment

      - name: Run kurtosis
        uses: ./.github/workflows/actions/run-kurtosis-docker

  # run_k8s_test:
  #   name: Run k8s tests
  #   uses: ./.github/workflows/reusable-run-k8s.yml
  #   secrets: inherit

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup environment
        uses: ./.github/workflows/actions/setup-environment

      - name: Run lint
        run: just lint

  test:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup environment
        uses: ./.github/workflows/actions/setup-environment

      - name: Run unit tests
        run: just test
