name: checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ startsWith(github.ref, 'refs/pull/') }}

jobs:
  version-matrix:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: pip install -r scripts/version-matrix/requirements.txt ruff==0.14.3

      - name: Lint python
        run: ruff check scripts/version-matrix

      - name: Verify external package pins
        run: python3 scripts/version-matrix/verify-package-pins.py

      - name: Lint markdown
        run: rumdl check docs scripts/version-matrix

  shellcheck:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The op-signer scripts are left out: they use bash features under a sh
      # shebang, and run inside the op-signer image.
      - name: Run shellcheck
        run: shellcheck --severity=warning .github/scripts/*.sh static_files/scripts/*.sh util/ns-authz/*.sh

  yamllint:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Run yamllint
        run: pipx run --spec yamllint==1.38.0 yamllint --strict .
