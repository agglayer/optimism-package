name: checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ startsWith(github.ref, 'refs/pull/') }}

jobs:
  lint:
    permissions:
      contents: read
    uses: 0xPolygon/kurtosis-workflows/.github/workflows/lint.yml@d9bb850e47a456b6519c1ba12ee9fbd32f21fe34 # v0.1.5

  package-pins:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Install pyyaml
        run: pip install PyYAML==6.0.3

      - name: Verify external package pins
        run: python3 scripts/version-matrix/verify-package-pins.py

  shellcheck:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      # The op-signer scripts are left out: they use bash features under a sh
      # shebang, and run inside the op-signer image.
      - name: Run shellcheck
        run: shellcheck --severity=warning .github/scripts/*.sh static_files/scripts/*.sh util/ns-authz/*.sh

  yamllint:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Run yamllint
        run: pipx run --spec yamllint==1.38.0 yamllint --strict .
