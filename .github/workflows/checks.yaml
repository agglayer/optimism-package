name: checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ startsWith(github.ref, 'refs/pull/') }}

jobs:
  lint:
    permissions:
      contents: read
    uses: 0xPolygon/kurtosis-workflows/.github/workflows/lint.yml@v0.1.4
    with:
      # The Kurtosis and Starlark lints run in per-pr.yml with the versions pinned in mise.toml.
      kurtosis_version: ""
      markdown_paths: docs scripts/version-matrix
      python_paths: scripts/version-matrix
      typos: false
      shfmt_version: ""

  package-pins:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install pyyaml
        run: pip install PyYAML==6.0.3

      - name: Verify external package pins
        run: python3 scripts/version-matrix/verify-package-pins.py

  shellcheck:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The op-signer scripts are left out: they use bash features under a sh
      # shebang, and run inside the op-signer image.
      - name: Run shellcheck
        run: shellcheck --severity=warning .github/scripts/*.sh static_files/scripts/*.sh util/ns-authz/*.sh

  yamllint:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Run yamllint
        run: pipx run --spec yamllint==1.38.0 yamllint --strict .
