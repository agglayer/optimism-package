name: version-matrix

on:
  schedule:
    - cron: "0 4 * * 1" # Runs at 04:00 UTC every Monday
  workflow_dispatch:
    inputs:
      notify:
        description: Post the summary to Slack, as scheduled runs do.
        type: boolean
        default: false

permissions: {}

jobs:
  version-matrix:
    permissions:
      actions: read
      contents: read
      id-token: write
      pull-requests: read
    uses: 0xPolygon/kurtosis-workflows/.github/workflows/version-matrix.yml@d9bb850e47a456b6519c1ba12ee9fbd32f21fe34 # v0.1.5
    with:
      label: Kurtosis OP version matrix
      use_mise: true
    # `secrets: inherit` does not cross organizations, so the secrets are passed by name.
    secrets:
      claude_api_key: ${{ secrets.CLAUDE_API_KEY }}
      app_id: ${{ secrets.SEMANTIC_RELEASE_BOT_APP_ID }}
      app_private_key: ${{ secrets.SEMANTIC_RELEASE_BOT_APP_PRIVATE_KEY }}
      slack_bot_token: ${{ secrets.SLACK_BOT_TOKEN }}
