optimism_package:
  chains:
    "001":
      participants:
        "node1":
          el:
            type: op-reth
          cl:
            type: op-node
      batcher_params:
        max_channel_duration: 10

ethereum_package:
  participants:
    - el_type: geth
      el_image: ethereum/client-go:v1.17.10
      el_extra_params:
        - --rpc.txfeecap=0 # op-deployer v0.9 deployments exceed the default 1 ETH per-tx fee cap
        - --rpc.gascap=1000000000 # deployments can exceed the default 50M eth_call gas cap
      cl_type: lighthouse
      cl_image: sigp/lighthouse:v8.3.3
      supernode: true # required for fulu hf if perfect peerDAS is not enabled
  network_params:
    preset: minimal
    seconds_per_slot: 2
    genesis_delay: 5
    additional_preloaded_contracts: '
      {
        "0x4e59b44847b379578588920cA78FbF26c0B4956C": {
          "balance": "0ETH",
          "code": "0x7fffffffffffffffffffffffffffffffffffffffffffffffffffffffffffffffe03601600081602082378035828234f58015156039578182fd5b8082525050506014600cf3",
          "storage": {},
          "nonce": "1"
        }
      }'

    # Ethereum hard fork configurations.
    # Supported fork epochs are documented in `static_files/genesis-generation-config/el-cl/values.env.tmpl` in the
    # ethereum package repository.
    altair_fork_epoch: 0
    bellatrix_fork_epoch: 0
    capella_fork_epoch: 0
    deneb_fork_epoch: 0
    electra_fork_epoch: 0
    fulu_fork_epoch: 0 # requires a supernode or perfect PeerDAS to be enabled
    # Blob parameter only (BPO) forks bump the blob target/max. BPO 3 to 5 stay disabled, as in the ethereum package defaults.
    bpo_1_epoch: 0
    bpo_2_epoch: 0
    gloas_fork_epoch: 0 # Glamsterdam: Gloas (CL) + Amsterdam (EL)
