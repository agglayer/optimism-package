optimism_package:
  chains:
    "001":
      participants:
        "node1":
          el:
            type: op-geth
          cl:
            type: op-node
      batcher_params:
        max_channel_duration: 10
  op_contract_deployer_params:
    image: europe-west2-docker.pkg.dev/prj-polygonlabs-devtools-dev/public/op-deployer:v0.4.2-cdk
    # l1_artifacts_locator: tag://op-contracts/v4.0.0
    # l2_artifacts_locator: tag://op-contracts/v4.0.0
    # Instead of using the tag:// locator which pulls from https://storage.googleapis.com/oplabs-contract-artifacts/,
    # we serve the artifacts from a local file server to avoid external pulls - like in Antithesis environments.
    # To compute the uri of the artifacts locator, you can use the following:
    # https://storage.googleapis.com/oplabs-contract-artifacts/artifacts-v1-<checksum>.tar.gz
    # where <checksum> can be found in `op-deployer/pkg/deployer/standard/standard.go` of the op-deployer branch.
    # For reference: https://github.com/leovct/optimism/blob/op-deployer/v0.4.2-cdk/op-deployer/pkg/deployer/standard/standard.go#L90
    l1_artifacts_locator: http://file-server:80/artifacts-v1-44f2b904c73df5d0e54ca6e51d081ada1e4d75ca5b136513b61ea1566459eaa5.tar.gz
    l2_artifacts_locator: http://file-server:80/artifacts-v1-44f2b904c73df5d0e54ca6e51d081ada1e4d75ca5b136513b61ea1566459eaa5.tar.gz
    locator_local_archive_path: static_files/fileserver/artifacts-v1-44f2b904c73df5d0e54ca6e51d081ada1e4d75ca5b136513b61ea1566459eaa5.tar.gz
  observability:
    enabled: false
